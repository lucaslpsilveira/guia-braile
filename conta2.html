  <body id="corpoJogos" onload="document.form.chute.focus(); ">

	<div id="tituloJogos">
		    <h2>Adivinhe a Letra</h2><br />
		<p>Procure a simbologia correspondente a letra sorteada. </p> 
    <script type="text/javascript">     

      //nivel = 1; // Nível padrão
      max = 10;  // Escolha máxima padrão do usuário
	  cont = 1;
      Pensar();  // O PC "pensa" em um número dentro do intervalo solicitado  

      function Pensar() {
	   //alert(cont++);
        numeroSecreto = Math.round(Math.random()* 100);
		numeroSecreto2 = Math.round(Math.random()* 10 +1);// Fórmula que o PC usa para "pensar" num número
        sorteia = Math.round(Math.random()* 1+1);
		contador = 0;      		// Zera o contador
		switch (sorteia) {
			case 1:    //LETRAS
				result = numeroSecreto * numeroSecreto2;
				ind = 'x';
			break;
			case 2:
				result = numeroSecreto / numeroSecreto2;
				ind = ':';
			break;
	  }
	  document.write("	<h1 id='letraSorteada'>"+numeroSecreto + ind + numeroSecreto2+"</h1>");
	
	}
	
      function Testar() {
        valorUsuario = document.form.chute.value;  // A escolha do usuário
		
        if (result != valorUsuario) {
          contador++; // Incrementa o contador
          alert('Errou mane!');
        }
        else {
          contador++;
          alert('Aee campeaooo, acertou em: ' +contador+ ' tentativa(s)');
          Pensar();
        }
        document.form.chute.value = "";   // Limpa o campo p/ facilitar a vida do usuário
        document.form.chute.focus();   
        return false                     // Retorna falso, isto é, não submete o formulário
      }



      //-->
   </script>
  <!-- Inicio div menu jogos-->
		<div id="formChutar">
			<div id='adivinhaLetra' >
				<form name="form" onsubmit="return Testar()" method="post" action="#">	<!--Informe a letra sorteada: <input type="text" size="6"  name="chute" />&nbsp;&nbsp;-->
				 <table id="inputChutar">
				 <tr>
				 <td><p>Chute um valor: </p></td>
				 <td><input id="chute" type="text" name="chute"></input>&nbsp;&nbsp;</td>
				<td><input id="btnEnviar" type="submit" name="arriscar" value="Arriscar!" onmouseover="style.color = '#FF0000'" onmouseout="style.color = ''" />&nbsp;&nbsp;</td>
				</tr>
				</table></form>
				<h2  id='condicao'></h2>
				</div>

</div>
